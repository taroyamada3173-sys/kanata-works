<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>売上CSV整形・集計ツールの見本｜KanataWorks</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP","Hiragino Sans",Meiryo,sans-serif;color:#26323a;background:#f4f6f7;line-height:1.6}main{max-width:980px;margin:0 auto;padding:20px 14px 48px}h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:26px 0 8px}p{margin:0 0 10px}.box{background:#fff;border:1px solid #dde4e8;border-radius:8px;padding:14px;margin-bottom:12px}textarea{width:100%;height:170px;font:13px/1.45 Consolas,monospace;border:1px solid #c5d0d6;border-radius:6px;padding:8px}button,label.b{display:inline-block;background:#176b87;color:#fff;border:0;border-radius:6px;padding:9px 14px;font-size:14px;cursor:pointer;margin:6px 6px 0 0}button.s,label.b{background:#e8eef1;color:#26323a}input[type=file]{display:none}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.k div{background:#fff;border:1px solid #dde4e8;border-radius:8px;padding:10px;text-align:center}.k b{display:block;font-size:24px;color:#176b87}.k .w b{color:#c2410c}.t{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}th,td{border:1px solid #dde4e8;padding:6px 8px;text-align:left;white-space:nowrap}th{background:#eef3f5}td.n{text-align:right}tr.ng td{background:#fff4ed}small{color:#5b6b75}</style></head><body><main>
<h1>売上CSV整形・集計ツールの見本</h1>
<p>表記ゆれのある売上CSVを整え、重複と要確認の行を分けて、月別・取引先別に集計します。データはブラウザ内だけで処理し、外部へ送信しません。見本のデータはすべて架空です。</p>
<div class="box"><p><b>入力</b>（列：日付, 取引先, 商品, 数量, 単価）</p><textarea id="in" spellcheck="false"></textarea><br>
<button id="run">整形して集計</button><button class="s" id="sample">見本データを入れる</button><label class="b">CSVファイルを選ぶ<input type="file" id="file" accept=".csv,text/csv"></label><button class="s" id="dl" disabled>整形済みCSVを保存</button></div>
<div id="out" hidden><div class="k"><div><b id="c0">0</b>入力行</div><div><b id="c1">0</b>正常</div><div class="w"><b id="c2">0</b>重複</div><div class="w"><b id="c3">0</b>要確認</div><div><b id="c4">0</b>合計金額（円）</div></div>
<h2>要確認・重複の行</h2><div class="t" id="ng"></div><h2>月別の集計</h2><div class="t" id="m"></div><h2>取引先別の集計</h2><div class="t" id="c"></div><h2>整形済みデータ</h2><div class="t" id="ok"></div></div>
<p><small>業務ごとの列や判定ルールに合わせて作り替えられます。Excel・Googleスプレッドシート・基幹システムの出力形式にも対応できます。</small></p>
</main><script>
const SAMPLE=`日付,取引先,商品,数量,単価
2026/10/1,株式会社みなと,用紙A4,10,"¥1,200"
2026-10-01,株式会社みなと,用紙A4,10,1200
2026年10月5日,㈱ひかり商事,トナー,２,"8,800"
2026/10/7, 有限会社さくら ,封筒,100,35
2026/10/32,株式会社みなと,用紙A4,3,1200
2026/11/2,,トナー,1,8800
2026/11/4,㈱ひかり商事,"ファイル,青",5,abc
2026/11/5,株式会社ひかり商事,ファイル,5,320
`;
function parseCSV(s){s=s.replace(/^﻿/,'');const R=[];let r=[],f='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()!==''))R.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x.trim()!==''))R.push(r);return R}
const zen=s=>String(s).replace(/[０-９Ａ-Ｚａ-ｚ，．－]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim();
function date(s){const m=zen(s).match(/^(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})日?$/);if(!m)return null;const[y,a,b]=[+m[1],+m[2],+m[3]];const d=new Date(Date.UTC(y,a-1,b));if(d.getUTCMonth()!==a-1||d.getUTCDate()!==b)return null;return`${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`}
const num=s=>{const t=zen(s).replace(/[¥￥円,\s]/g,'');return /^\d+$/.test(t)?+t:null};
const name=s=>zen(s).replace(/\s+/g,' ').replace(/㈱/g,'株式会社').replace(/㈲/g,'有限会社');
function clean(text){const rows=parseCSV(text);if(!rows.length)return{total:0,ok:[],dup:[],ng:[]};const head=rows[0].map(x=>x.trim());const hasH=head[0]==='日付';const body=hasH?rows.slice(1):rows;const seen=new Map(),ok=[],dup=[],ng=[];body.forEach((r,i)=>{const line=i+(hasH?2:1),why=[];if(r.length!==5)why.push('列数が5ではない');const d=date(r[0]??''),c=name(r[1]??''),p=name(r[2]??''),q=num(r[3]??''),u=num(r[4]??'');if(!d)why.push('日付が不正');if(!c)why.push('取引先が空');if(!p)why.push('商品が空');if(q===null)why.push('数量が不正');if(u===null)why.push('単価が不正');const o={line,date:d,client:c,item:p,qty:q,price:u,amount:q!==null&&u!==null?q*u:null,raw:r.join(' / ')};if(why.length){ng.push({...o,why:why.join('、')});return}const key=[d,c,p,q,u].join('|');if(seen.has(key)){dup.push({...o,why:seen.get(key)+'行目と重複'});return}seen.set(key,line);ok.push(o)});return{total:body.length,ok,dup,ng}}
function sum(a,f){const m=new Map();a.forEach(x=>{const k=f(x),e=m.get(k)||{n:0,t:0};e.n++;e.t+=x.amount;m.set(k,e)});return[...m].sort((x,y)=>x[0]<y[0]?-1:1)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tb=(h,r,cl)=>r.length?`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(c=>`<tr class="${cl||''}">${c.map(v=>`<td class="${typeof v==='number'?'n':''}">${typeof v==='number'?v.toLocaleString():esc(v)}</td>`).join('')}</tr>`).join('')}</table>`:'<p>該当なし</p>';
let last=null;function run(){const r=clean(document.getElementById('in').value);last=r;document.getElementById('out').hidden=false;const total=r.ok.reduce((a,x)=>a+x.amount,0);[r.total,r.ok.length,r.dup.length,r.ng.length,total].forEach((v,i)=>document.getElementById('c'+i).textContent=v.toLocaleString());document.getElementById('ng').innerHTML=tb(['行','理由','元の内容'],[...r.ng,...r.dup].sort((a,b)=>a.line-b.line).map(x=>[String(x.line),x.why,x.raw]),'ng');document.getElementById('m').innerHTML=tb(['月','件数','金額（円）'],sum(r.ok,x=>x.date.slice(0,7)).map(([k,e])=>[k,e.n,e.t]));document.getElementById('c').innerHTML=tb(['取引先','件数','金額（円）'],sum(r.ok,x=>x.client).map(([k,e])=>[k,e.n,e.t]));document.getElementById('ok').innerHTML=tb(['日付','取引先','商品','数量','単価','金額'],r.ok.map(x=>[x.date,x.client,x.item,x.qty,x.price,x.amount]));document.getElementById('dl').disabled=!r.ok.length}
const q=s=>/[",\n]/.test(s)?'"'+String(s).replace(/"/g,'""')+'"':String(s);
function csv(r){return'﻿日付,取引先,商品,数量,単価,金額\r\n'+r.ok.map(x=>[x.date,x.client,x.item,x.qty,x.price,x.amount].map(q).join(',')).join('\r\n')+'\r\n'}
document.getElementById('run').onclick=run;document.getElementById('sample').onclick=()=>{document.getElementById('in').value=SAMPLE;run()};document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const R=new FileReader();R.onload=()=>{document.getElementById('in').value=R.result;run()};R.readAsText(f)};document.getElementById('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv(last)],{type:'text/csv'}));a.download='cleaned.csv';a.click()};document.getElementById('in').value=SAMPLE;run();
</script></body></html>
